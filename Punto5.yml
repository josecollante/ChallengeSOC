title: Escalado de privilegios
id: 00000000-0000-0000-0000-000000000000
level: Medium
author: Jose Leandro Collante
date: 2026-05-06
description: |
  Detecta el uso de sudo para obtener una Terminal interactiva 
  de root, técnica común en escalada de privilegios.
tags: 
  - attack.privilege_escalation
  - attack.t1548
  - attack.t1548.003
status: testing
logsource:
  product: linux
  category: auditd
detection: 
  selection:
    CommandLine|contains: 
      - 'sudo su'
      - 'sudo -i'
      - 'sudo -s'
      - 'sudo -u'
      - 'sudo -l'
      - 'sudo /bin/bash'
      - 'sudo /bin/sh'
      - 'sudo /usr/bin/bash'
      - 'sudo /usr/bin/sh'
  exception_1:
    UserName: root
  condition: selection and not 1 of exception_* 