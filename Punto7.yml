title: AWS Root Credentials
id: 00000000-0000-0000-0000-000000000000
level: Medium
author: Jose Leandro Collante
date: 2026-05-06
description: |
  Detecta cualquier acción realizada por la cuenta raíz (Root) de AWS,
  lo cual es contrario a las mejores prácticas de seguridad.
tags:
  - attack.initial-access
  - attack.t1078.004
  - attack.privilege-escalation
  - attack.stealth
status: Testing
logsource:
  product: aws
  service: cloudtrail
detection:
    selection_usertype:
        userIdentity.type: Root
    selection_eventtype:
        eventType: AwsServiceEvent
    condition: selection_usertype and not selection_eventtype